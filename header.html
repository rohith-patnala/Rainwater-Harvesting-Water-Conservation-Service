<header class="site-header" id="siteHeader">

    <div class="site-container header-container">

        <!-- Logo -->
        <a
            href="index.html"
            class="brand-logo"
            aria-label="AquaHarvest Home"
        >
            <img
                src="./aquaharvest-logo.png"
                alt="AquaHarvest logo"
                class="brand-logo-image"
                width="48"
                height="48"
                loading="eager"
                decoding="async"
            >
            <span class="brand-logo-text" aria-label="AquaHarvest">
                <span class="aqua-text">Aqua</span><span class="harvest-text">Harvest</span>
            </span>
        </a>


        <!-- Desktop Navigation -->
        <nav
            class="main-navigation"
            aria-label="Main Navigation"
        >

            <!-- Home Dropdown -->
            <div class="nav-dropdown">

                <a
                    href="index.html"
                    class="nav-link nav-dropdown-toggle"
                >
                    <span>Home</span>
                    <i data-lucide="chevron-down"></i>
                </a>


                <div class="dropdown-menu">

                    <a
                        href="index.html"
                        class="dropdown-link"
                    >
                        Home 1
                    </a>

                    <a
                        href="home-2.html"
                        class="dropdown-link"
                    >
                        Home 2
                    </a>

                </div>

            </div>


            <a href="about.html" class="nav-link">
                About
            </a>

            <a href="services.html" class="nav-link">
                Services
            </a>

            <a href="case-studies.html" class="nav-link">
                Case Studies
            </a>

            <a href="pricing.html" class="nav-link">
                Pricing
            </a>

            <a href="contact.html" class="nav-link">
                Contact
            </a>

        </nav>


        <!-- Header Actions -->
        <div class="header-actions">

            <button
                type="button"
                class="header-icon-button"
                id="themeToggle"
                aria-label="Toggle dark mode"
                title="Toggle dark mode"
            >
                <i data-lucide="moon"></i>
            </button>


            <button
                type="button"
                class="header-icon-button rtl-button"
                id="directionToggle"
                aria-label="Toggle RTL and LTR"
                title="Toggle RTL/LTR"
            >
                <span aria-hidden="true">RTL</span>
            </button>


            <a
                href="book-now.html"
                class="header-cta"
            >
                <i data-lucide="calendar-check"></i>
                <span>Book Now</span>
            </a>


            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="mobileNavigation"
            >
                <i data-lucide="menu"></i>
            </button>

        </div>

    </div>


    <!-- Mobile Navigation -->
    <nav
        class="mobile-navigation"
        id="mobileNavigation"
        aria-label="Mobile Navigation"
    >

        <!-- Mobile Home Dropdown -->
        <div class="mobile-nav-dropdown">

            <button
                type="button"
                class="mobile-nav-link mobile-home-toggle"
                id="mobileHomeToggle"
                aria-expanded="false"
            >
                <span>Home</span>
                <i data-lucide="chevron-down"></i>
            </button>


            <div
                class="mobile-dropdown-menu"
                id="mobileHomeMenu"
            >

                <a
                    href="index.html"
                    class="mobile-dropdown-link"
                >
                    Home 1
                </a>

                <a
                    href="home-2.html"
                    class="mobile-dropdown-link"
                >
                    Home 2
                </a>

            </div>

        </div>


        <a
            href="about.html"
            class="mobile-nav-link"
        >
            About
        </a>

        <a
            href="services.html"
            class="mobile-nav-link"
        >
            Services
        </a>

        <a
            href="case-studies.html"
            class="mobile-nav-link"
        >
            Case Studies
        </a>

        <a
            href="pricing.html"
            class="mobile-nav-link"
        >
            Pricing
        </a>

        <a
            href="contact.html"
            class="mobile-nav-link"
        >
            Contact
        </a>


        <a
            href="contact.html"
            class="mobile-cta"
        >
            <i data-lucide="calendar-check"></i>
            Book Now
        </a>

    </nav>

</header>
